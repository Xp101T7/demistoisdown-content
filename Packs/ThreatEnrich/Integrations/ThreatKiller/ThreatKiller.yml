commonfields:
  id: ThreatKiller
  version: -1
name: ThreatKiller
display: ThreatKiller (OpenCTI)
category: Data Enrichment & Threat Intelligence
description: Enriches IP, URL, Domain, and File Hash indicators using OpenCTI's GraphQL API.
configuration:
- display: OpenCTI Base URL
  name: base_url
  defaultvalue: http://opencti:4000
  type: 0
  required: true
  additionalinfo: Your OpenCTI instance URL e.g. https://opencti.yourcompany.com
- display: API Token
  name: credentials
  type: 9
  required: true
  additionalinfo: UUID token from your OpenCTI user profile
- display: Trust any certificate (not secure)
  name: insecure
  type: 8
  required: false
- display: Use system proxy settings
  name: proxy
  type: 8
  required: false
script:
  script: ''
  type: python
  subtype: python3
  dockerimage: demisto/python3:3.10.13.86272
  commands:
  - name: ip
    description: Enriches an IP address using OpenCTI.
    arguments:
    - name: ip
      required: true
      description: IP address to enrich.
      isArray: true
    outputs:
    - contextPath: ThreatKiller.IP.Value
      description: The IP address.
      type: String
    - contextPath: ThreatKiller.IP.EntityType
      description: The STIX entity type.
      type: String
    - contextPath: ThreatKiller.IP.Indicators
      description: Linked indicators from OpenCTI.
      type: Unknown
    - contextPath: ThreatKiller.IP.Reports
      description: Linked reports from OpenCTI.
      type: Unknown
    - contextPath: DBotScore.Indicator
      description: The indicator value.
      type: String
    - contextPath: DBotScore.Type
      description: The indicator type.
      type: String
    - contextPath: DBotScore.Score
      description: The DBot score.
      type: Number
    - contextPath: DBotScore.Vendor
      description: The vendor used to calculate the score.
      type: String
  - name: url
    description: Enriches a URL using OpenCTI.
    arguments:
    - name: url
      required: true
      description: URL to enrich.
      isArray: true
    outputs:
    - contextPath: ThreatKiller.URL.Value
      description: The URL.
      type: String
    - contextPath: ThreatKiller.URL.EntityType
      description: The STIX entity type.
      type: String
    - contextPath: ThreatKiller.URL.Indicators
      description: Linked indicators from OpenCTI.
      type: Unknown
    - contextPath: ThreatKiller.URL.Reports
      description: Linked reports from OpenCTI.
      type: Unknown
    - contextPath: DBotScore.Indicator
      description: The indicator value.
      type: String
    - contextPath: DBotScore.Score
      description: The DBot score.
      type: Number
  - name: domain
    description: Enriches a domain using OpenCTI.
    arguments:
    - name: domain
      required: true
      description: Domain to enrich.
      isArray: true
    outputs:
    - contextPath: ThreatKiller.Domain.Value
      description: The domain.
      type: String
    - contextPath: ThreatKiller.Domain.EntityType
      description: The STIX entity type.
      type: String
    - contextPath: ThreatKiller.Domain.Indicators
      description: Linked indicators from OpenCTI.
      type: Unknown
    - contextPath: ThreatKiller.Domain.Reports
      description: Linked reports from OpenCTI.
      type: Unknown
    - contextPath: DBotScore.Indicator
      description: The indicator value.
      type: String
    - contextPath: DBotScore.Score
      description: The DBot score.
      type: Number
  - name: file
    description: Enriches a file hash using OpenCTI.
    arguments:
    - name: file
      required: true
      description: File hash (MD5, SHA1, SHA256) to enrich.
      isArray: true
    outputs:
    - contextPath: ThreatKiller.File.Value
      description: The file hash.
      type: String
    - contextPath: ThreatKiller.File.EntityType
      description: The STIX entity type.
      type: String
    - contextPath: ThreatKiller.File.Indicators
      description: Linked indicators from OpenCTI.
      type: Unknown
    - contextPath: ThreatKiller.File.Reports
      description: Linked reports from OpenCTI.
      type: Unknown
    - contextPath: DBotScore.Indicator
      description: The indicator value.
      type: String
    - contextPath: DBotScore.Score
      description: The DBot score.
      type: Number
fromversion: 8.0.0
marketplaces:
- marketplacev2